apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runbook-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/siddhipankhania12/incident-runbook-assistant.git
    targetRevision: main
    path: helm/runbook-assistant
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
